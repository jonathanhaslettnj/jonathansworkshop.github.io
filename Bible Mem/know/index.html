<!DOCTYPE html>
<html lang="en">

<style>
#topMenu {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 10px 0;
}

#topMenu button {
    width: 120px;
    height: 44px;
}</style>

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Slow Bible Memorizer</title>

    <link rel="stylesheet"
          href="slowmemorizer.css?v=7">
</head>

<body>
<div id="topMenu">
    <button id="goToCopy">Copy It</button>
    <button id="goToRead">Read It</button>
    <button id="goToSave">Save It</button>
    <button id="goToKnow">Know It</button>
</div>

<div id="app">

    <h1>Slow Bible Memorizer</h1>

    <select id="listSelect">
        <option value="1">List 1</option>
        <option value="2">List 2</option>
        <option value="3">List 3</option>
    </select>

    <div id="verseReferenceDisplay"></div>

    <div id="currentVerseDisplay">
        Ready
    </div>

    <div id="fullVerseDisplay"></div>

    <div id="speedControl">

        <label for="speedSlider">
            Pause Between Words:
            <span id="speedLabel">3000</span> ms
        </label>

        <input
            id="speedSlider"
            type="range"
            min="50"
            max="10000"
            step="100"
            value="3000">

    </div>

    <div id="controls">

        <button id="playBtn">
            Play
        </button>

        <button id="pauseBtn">
            Pause
        </button>

        <button id="stopBtn">
            Stop
        </button>

    </div>

    <div id="navControls">

        <button id="prevBtn">
            Previous Verse
        </button>

        <button id="nextBtn">
            Next Verse
        </button>

    </div>

    <h2>Verses in Current List</h2>

    <div id="savedVerses"></div>

</div>

<script src="slowmemorizer.js?v=7"></script>
<script>
document.getElementById("goToRead").onclick = function () {
    window.location.href = "../read/index.html";
};

document.getElementById("goToCopy").onclick = function () {
    window.location.href = "../copy/index.html";
};

document.getElementById("goToSave").onclick = function () {
    window.location.href = "../save/index.html";
};

document.getElementById("goToKnow").onclick = function () {
    window.location.href = "../know/index.html";
};
</script>
</body>
</html>
