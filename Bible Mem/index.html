
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bible Memory Verse Module</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 15px;
            line-height: 1.6;
        }

        h1 {
            color: #003399;
            text-align: center;
            margin-bottom: 20px;
        }

        h2 {
            text-align: center;
            margin-top: -10px;
            color: #444;
        }

        select,
        input[type="text"] {
            width: 100%;
            padding: 10px;
            font-size: 18px;
            margin-top: 10px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        /* Shorten translation dropdown, reference input, and word input */
        #mv_translation,
        #mv_reference_input,
        #mv_input {
            width: 20ch;
            display: inline-block;
        }

        #mv_instruction {
            font-size: 12px;
            color: #555;
            margin-bottom: 10px;
        }

        #mv_progress {
            white-space: pre-wrap;
            margin-top: 5px;
            min-height: 1.2rem;
        }

        #mv_status {
            margin-top: 5px;
            min-height: 1.2rem;
        }

        .button-line {
            margin-top: 20px;
            text-align: center;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
        }

        @media (max-width: 480px) {
            body {
                margin: 10px;
                padding: 10px;
            }

            h1 {
                font-size: 24px;
            }

            select,
            input[type="text"] {
                font-size: 16px;
                padding: 8px;
            }

            button {
                font-size: 15px;
                padding: 10px 16px;
            }
        }
    </style>
</head>

<body>

    <h1>Bible Verse Memorizer</h1>
    <h2>Translations in the Public Domain</h2>

    <!-- Translation Selector -->
    <select id="mv_translation">
        <option value="kjv">King James Version (KJV)</option>
        <option value="asv">American Standard Version (ASV)</option>
        <option value="bbe">Bible in Basic English (BBE)</option>
    </select>

    <!-- Reference Input -->
    <input id="mv_reference_input" type="text" placeholder="Type verse (e.g. Genesis 1:1)">
    <div id="mv_instruction">Type the full name, chapter, and verse, then hit Enter.</div>

    <!-- Verse Reference Display -->
    <div id="mv_reference" style="margin-top:10px; font-weight:bold;"></div>

    <!-- Memorizer Output -->
    <div id="mv_progress"></div>
    <div id="mv_next"></div>
    <div id="mv_reveal"></div>
    <div id="mv_status"></div>

    <!-- Word Input -->
    <input id="mv_input" type="text" placeholder="Type next word">

    <!-- Buttons -->
    <div class="button-line">
        <button id="mv_next_verse">Next Verse ▶</button>
    </div>

    <div class="button-line">
        <button id="mv_restart" onclick="restartModule()">Start Over</button>
    </div>

    <!-- Voice Controls -->
    <button id="startVoice">🎤 Start Voice</button>
    <button id="stopVoice">🛑 Stop Voice</button>

    <!-- Developer Mode -->
    <button id="testVoiceConfigBtn">Test Voice Config</button>

    <div id="devModePanel"
         style="
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            background: #f9f9f9;
         ">

        <!-- Step 8 Voice Dashboard -->
        <div id="voiceDashboard" style="margin-top:20px;">
            <h3>Voice Dashboard</h3>

            <div><strong>Listening:</strong> <span id="vd_listening">OFF</span></div>
            <div><strong>Last Transcript:</strong> <span id="vd_transcript"></span></div>
            <div><strong>Last Command:</strong> <span id="vd_command"></span></div>
            <div><strong>Last Spoken Word:</strong> <span id="vd_spoken"></span></div>
            <div><strong>Mistakes:</strong> <span id="vd_mistakes">0</span></div>

            <button id="vd_clear">Clear Dashboard</button>
        </div>
    </div>



    <!-- Developer Mode UI -->
    <script type="module">
        import { initDeveloperModeUI } from "./devModeUI.js";
        initDeveloperModeUI();
    </script>

    <!-- Router Test Function -->
    <script type="module">
        import { routeVoiceCommand, executeVoiceCommand } from "./voiceRouter.js";

        window.testVoice = function (phrase) {
            const cmd = routeVoiceCommand(phrase);
            executeVoiceCommand(cmd);
        };
    </script>

    <!-- Dashboard Clear Button -->
    <script type="module">
        import { clearDashboard } from "./voiceDashboard.js";

        document.getElementById("vd_clear").addEventListener("click", () => {
            clearDashboard();
        });
    </script>

    <!-- Memorizer Core -->
    <script src="mv_core.js?v=12"></script>
    <script src="mv_input.js?v=12"></script>

<!-- Voice Recognition Engine -->
<script type="module">
  import { initSpeechRecognition, startListening, stopListening }
    from "./voiceRecognition.js";

  window.initSpeechRecognition = initSpeechRecognition;
  window.startListening = startListening;
  window.stopListening = stopListening;

  // ⭐ REQUIRED: initialize the engine
  initSpeechRecognition();
</script>


    <div id="mv_version_banner"
         style="
            background:#003399;
            color:white;
            padding:8px 12px;
            font-size:14px;
            font-weight:bold;
            text-align:center;
            border-radius:6px;
            margin-bottom:15px;
         ">
        v12 – Developer Mode – lbyl – Multi‑Version
    </div>

</body>
</html>
