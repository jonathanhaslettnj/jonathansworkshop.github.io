/* ------------------------------
   BASE PAGE STYLING
   ------------------------------ */

body {
  text-align: center;
  font-family: Arial, sans-serif;

}

h1 {

}

/* Centered bordered video box */
.unit-box {
  border: 2px solid #444;

  margin: 30px auto;

}

.doc-link-box a {

  text-decoration: none;
  color: #003399;
  word-break: break-word;
}

/* Responsive video */
iframe {
  width: 100%;
  height: 260px;
  border: none;
  border-radius: 6px;
}

/* Return box */
.return-box {
  background: #e6f2ff;
  border: 2px solid #7aaee6;
  padding: 12px;
  margin: 40px auto 0 auto;
  width: 70%;
  max-width: 350px;
  border-radius: 8px;
  font-size: 20px;
}

.return-box a {
  text-decoration: none;
  color: #004a99;
}

/* -----------------------------------------
   MOBILE ENLARGEMENT — 25% LARGER
   ----------------------------------------- */

@media (max-width: 600px) {

  body {
    font-size: 22px;
  }

  h1 {
    font-size: 60px;
  }

    font-size: 24px;
  }
