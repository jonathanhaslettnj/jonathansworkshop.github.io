<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Memory Verse Module</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        #mv_progress {
            margin-top: 15px;
            font-size: 1.3em;
            font-weight: bold;
        }
        #mv_reveal {
            margin-top: 10px;
            color: #555;
        }
        #mv_status {
            margin-top: 10px;
            font-weight: bold;
            color: #006600;
        }
        #mv_input {
            margin-top: 15px;
            padding: 8px;
            font-size: 1.1em;
            width: 300px;
        }
    </style>
</head>

<body>

<h2>Bible Memory Verse Module</h2>

<button onclick="loadVerse('For God so loved the world that he gave his only begotten Son')">
    Load John 3:16 (test verse)
</button>

<div id="mv_progress"></div>

<input id="mv_input" type="text" placeholder="Type next word"
       onkeyup="handleKey(event);" />


<div id="mv_reveal"></div>
<div id="mv_status"></div>

<script src="memory_verse.js"></script>

</body>
</html>
