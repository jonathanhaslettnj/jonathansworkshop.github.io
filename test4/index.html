<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bible Memory Verse Module</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 15px;
            line-height: 1.6;
        }

        h1 {
            color: #003399;
            text-align: center;
            margin-bottom: 20px;
        }

        h2 {
            text-align: center;
            margin-top: -10px;
            color: #444;
        }

        /* Input boxes set to 30ch */
        #mv_translation,
        #mv_reference_input,
        #mv_input {
            width: 30ch;
            display: inline-block;
        }

        select,
        input[type="text"] {
            padding: 10px;
            font-size: 18px;
            margin-top: 10px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        #mv_instruction {
            font-size: 12px;
            color: #555;
            margin-bottom: 10px;
        }

        #mv_progress {
            white-space: pre-wrap;
            margin-top: 5px;
            min-height: 1.2rem;
        }

        #mv_status {
            margin-top: 5px;
            min-height: 1.2rem;
        }

        .button-line {
            margin-top: 20px;
            text-align: center;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
        }

        @media (max-width: 480px) {
            body {
                margin: 10px;
                padding: 10px;
            }
