<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greek Speech Test</title>

<style>
body{
    font-family:Arial, sans-serif;
    max-width:900px;
    margin:20px auto;
    padding:20px;
    line-height:1.6;
}

button{
    padding:10px 20px;
    margin:5px;
    font-size:16px;
    cursor:pointer;
}

select{
    width:100%;
    padding:8px;
    margin-bottom:10px;
}

textarea{
    width:100%;
    height:140px;
    font-size:24px;
    padding:10px;
}

#log{
    margin-top:20px;
    padding:10px;
    border:1px solid #ccc;
    background:#f5f5f5;
    white-space:pre-wrap;
    min-height:150px;
}
</style>
</head>
<body>

<h1>Greek Speech Test</h1>

<label for="voiceSelect">Voice:</label>
<select id="voiceSelect"></select>

<textarea id="greekText">
Βίβλος γενέσεως Ἰησοῦ Χριστοῦ υἱοῦ Δαυὶδ υἱοῦ Ἀβραάμ
</textarea>

<br>

<button id="speakBtn">Speak</button>
<button id="stopBtn">Stop</button>
<button id="listBtn">List Voices</button>
<button id="athenaBtn">Test Αθηνά</button>
<button id="nestorBtn">Test Νέστορας</button>

<div id="log"></div>

<script>

const voiceSelect = document.getElementById("voiceSelect");
const logDiv = document.getElementById("log");

let voices = [];

function log(msg){
    console.log(msg);
    logDiv.textContent += msg + "\n";
}

function populateVoices(){

    voices = speechSynthesis.getVoices();

    voiceSelect.innerHTML = "";

    voices.forEach((voice,index)=>{

        const opt=document.createElement("option");

        opt.value=index;

        opt.textContent=
            `${voice.name} (${voice.lang})`;

        voiceSelect.appendChild(opt);
    });

    log("Voices Found: " + voices.length);

    voices.forEach(v=>{
        if(v.lang.toLowerCase().startsWith("el")){
            log("Greek Voice: " + v.name + " [" + v.lang + "]");
        }
    });
}

speechSynthesis.onvoiceschanged = populateVoices;

populateVoices();

document.getElementById("listBtn").addEventListener("click",()=>{

    logDiv.textContent="";

    voices.forEach((v,i)=>{

        log(
            i +
            " | " +
            v.name +
            " | " +
            v.lang
        );

    });

});

document.getElementById("speakBtn").addEventListener("click",()=>{

    speechSynthesis.cancel();

    const text =
        document.getElementById("greekText").value;

    const utterance =
        new SpeechSynthesisUtterance(text);

    const selected =
        voices[voiceSelect.value];

    if(selected){
        utterance.voice = selected;
        utterance.lang = selected.lang;
    }
    else{
        utterance.lang = "el-GR";
    }

    logDiv.textContent = "";

    log("TEXT:");
    log(text);

    log("");
    log("LANG:");
    log(utterance.lang);

    log("");
    log("VOICE:");
    log(
        selected
        ? selected.name
        : "none"
    );

    utterance.onstart = () => {
        log("");
        log("Speech Started");
    };

    utterance.onend = () => {
        log("Speech Finished");
    };

    utterance.onerror = (e) => {
        log("Speech Error: " + e.error);
    };

    speechSynthesis.speak(utterance);

});

document.getElementById("stopBtn").addEventListener("click",()=>{

    speechSynthesis.cancel();

    log("Speech Cancelled");

});
function speakWithVoiceName(targetName){

    speechSynthesis.cancel();

    const voice = voices.find(v =>
        v.name.includes(targetName)
    );

    if(!voice){
        log("Voice not found: " + targetName);
        return;
    }

    const utt = new SpeechSynthesisUtterance(
        "Βίβλος γενέσεως Ἰησοῦ Χριστοῦ"
    );

    utt.voice = voice;
    utt.lang = voice.lang;

    logDiv.textContent = "";

    log("Testing voice: " + voice.name);
    log("Language: " + voice.lang);

    utt.onstart = () => log("Started");
    utt.onend = () => log("Finished");
    utt.onerror = e => log("ERROR: " + e.error);
    utt.rate = 0.5;

    speechSynthesis.speak(utt);
}
</script>

</body>
</html>
