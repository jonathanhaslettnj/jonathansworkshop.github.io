   BASE PAGE STYLING
   ------------------------------ */

body {
  text-align: center;
  font-family: Arial, sans-serif;
  padding: 20px;
  font-size: 18px;
  background: #ffffff;
}

h1 {

.content-box {
  background: #f7faff;
  border: 2px solid #aac7ff;
  padding: 20px;
  margin: 30px auto;
  width: 90%;
  max-width: 700px;
  border-radius: 10px;
}

/* Video viewer */
.viewer-box iframe {
  width: 100%;
  height: 315px;
  border: none;
  border-radius: 8px;
}

/* Link list */
.link-list a {
  display: block;
  padding: 10px 0;
  border-bottom: 1px solid #999;
  text-decoration: none;
  font-size: 20px;
  color: #003399;
}

/* Single link boxes */
.link-box {
  margin-top: 25px;
  font-size: 22px;
}

.link-box a {
  text-decoration: none;
  color: #003399;
  word-break: break-word;
}

/* Return box */
.return-box {
  background: #e6f2ff;
  border: 2px solid #7aaee6;
  padding: 12px;
  margin: 40px auto 0 auto;
  width: 70%;
  max-width: 350px;
  border-radius: 8px;
  font-size: 20px;
}

.return-box a {
  text-decoration: none;
  color: #004a99;
}

/* -----------------------------------------
   PHONE‑ONLY ADJUSTMENTS — 25% LARGER
   ----------------------------------------- */

@media (max-width: 480px) {

  body {
    font-size: 22px;

  }

  .link-list a {
    font-size: 25px;
    padding: 12px 0;
  }

  .link-box {
    font-size: 28px;
  }

  .return-box {
    font-size: 25px;
    padding: 15px;
  }

  iframe {
    height: 394px; /* 315 × 1.25 */
  }
}
