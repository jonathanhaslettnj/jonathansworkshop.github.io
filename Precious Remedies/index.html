<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Jonathan's Workshop</title>

<style>
  body {
    text-align: center;
    font-family: Arial, sans-serif;
    padding: 20px;
    font-size: 18px;
  }

  h1 {
    font-size: 48px;
    font-weight: bold;
    color: blue;
    margin-bottom: 10px;
  }

  h2 {
    font-size: 32px;
    font-weight: bold;
    color: darkgreen;
    margin-top: 30px;
    margin-bottom: 20px;
  }

  .viewer-box {
    width: 90%;
    max-width: 560px;
    margin: 25px auto;
  }

  iframe {
    width: 100%;
    height: 315px;
    border: none;
    border-radius: 8px;
  }

  .simple-box {
    border: 2px solid #7aaee6;
    padding: 12px;
    margin: 25px auto;
    width: 70%;
    max-width: 350px;
    border-radius: 8px;
    font-size: 20px;
  }

  .simple-box a {
    text-decoration: none;
    color: #004a99;
  }

  .return-box {
    background: #e6f2ff;
    border: 2px solid #7aaee6;
    padding: 12px;
    margin: 40px auto 0 auto;
    width: 70%;
    max-width: 350px;
    border-radius: 8px;
    font-size: 20px;
  }

  .return-box a {
    text-decoration: none;
    color: #004a99;
  }

  /* -----------------------------------------
     PHONE‑ONLY ADJUSTMENTS — 25% LARGER
     ----------------------------------------- */
  @media (max-width: 480px) {

    body {
      font-size: 22px;
    }

    h1 {
      font-size: 60px;
    }

    h2 {
      font-size: 40px;
    }

    .simple-box {
      font-size: 25px;
      padding: 15px;
    }

    .return-box {
      font-size: 25px;
      padding: 15px;
    }

    iframe {
      height: 394px; /* 315 × 1.25 */
    }
  }
</style>

</head>

<body>

<h1>Your Page Title Here</h1>

<div class="viewer-box">
  <iframe
    src="https://www.youtube.com/embed/VIDEO_ID_HERE"
    allowfullscreen>
  </iframe>
</div>

<div class="simple-box">
  <a href="your-file-1.pdf">Your First Link</a>
</div>

<div class="simple-box">
  <a href="your-file-2.pdf">Your Second Link</a>
</div>

<div class="return-box">
  <a href="../index.html">Return to Opening Page</a>
</div>

</body>
</html>
