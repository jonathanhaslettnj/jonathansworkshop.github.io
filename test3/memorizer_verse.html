<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bible Memory Verse Module</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 15px;
            line-height: 1.6;
        }

        h1 {
            color: #003399;
            text-align: center;
            margin-bottom: 20px;
        }

        h2 {
            text-align: center;
            margin-top: -10px;
            color: #444;
        }

        select,
        input[type="text"] {
            width: 100%;
            padding: 10px;
            font-size: 18px;
            margin-top: 10px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        /* Shorten translation dropdown, reference input, and word input */
        #mv_translation,
        #mv_reference_input,
        #mv_input {
            width: 20ch;
            display: inline-block;
        }

        #mv_instruction {
            font-size: 12px;
            color: #555;
            margin-bottom: 10px;
        }

        #mv_progress {
            white-space: pre-wrap;
            margin-top: 5px;
            min-height: 1.2rem;
        }

        #mv_status {
            margin-top: 5px;
            min-height: 1.2rem;
        }

        .button-line {
            margin-top: 20px;
            text-align: center;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
        }

        @media (max-width: 480px) {
            body {
                margin: 10px;
                padding: 10px;
            }

            h1 {
                font-size: 24px;
            }

            select,
            input[type="text"] {
                font-size: 16px;
                padding: 8px;
            }

            button {
                font-size: 15px;
                padding: 10px 16px;
            }
        }
    </style>
</head>

<body>

    <h1>Bible Verse Memorizer</h1>
    <h2>Translations in the Public Domain</h2>

    <!-- Translation Selector -->
    <select id="mv_translation">
        <option value="kjv">King James Version (KJV)</option>
        <option value="asv">American Standard Version (ASV)</option>
        <option value="bbe">Bible in Basic English (BBE)</option>
    </select>

    <!-- Reference Input -->
    <input id="mv_reference_input" type="text" placeholder="Type verse (e.g. Genesis 1:1)">
    <div id="mv_instruction">Type the full name, chapter, and verse, then hit Enter.</div>

    <!-- Verse Reference Display -->
    <div id="mv_reference" style="margin-top:10px; font-weight:bold;"></div>

    <!-- Memorizer Output -->
    <div id="mv_progress"></div>
    <div id="mv_next"></div>
    <div id="mv_reveal"></div>
    <div id="mv_status"></div>

    <!-- Word Input -->
    <input id="mv_input" type="text" placeholder="Type next word">

    <!-- Buttons -->
    <div class="button-line">
        <button id="mv_next_verse">Next Verse ▶</button>
    </div>

    <div class="button-line">
        <button id="mv_restart" onclick="restartModule()">Start Over</button>
    </div>

    <!-- Multi-version memorizer JS -->
    <script src="memory_verse.js?v=10"></script>

</body>
</html>
