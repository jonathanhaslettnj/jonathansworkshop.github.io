<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Master Scripture Index</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background: #f7f7f7;
    }
    h1 {
        text-align: center;
        margin-bottom: 30px;
    }
    .book {
        background: #e2e2e2;
        padding: 10px;
        margin-top: 10px;
        cursor: pointer;
        border-radius: 5px;
        font-size: 20px;
    }
    .chapter {
        background: #f0f0f0;
        padding: 8px;
        margin-left: 20px;
        cursor: pointer;
        border-radius: 5px;
        font-size: 17px;
    }
    .verses {
        margin-left: 40px;
        padding: 5px 10px;
        display: none;
        background: #ffffff;
        border-left: 3px solid #999;
    }
    a {
        text-decoration: none;
        color: #0066cc;
    }
    a:hover {
        text-decoration: underline;
    }
</style>
</head>
<body>

<h1>Master Scripture Index</h1>

<div id="index"></div>

<script>
// ------------------------------------------------------------
// CANONICAL BIBLE BOOK ORDER
// ------------------------------------------------------------
const bibleOrder = [
"Genesis","Exodus","Leviticus","Numbers","Deuteronomy",
"Joshua","Judges","Ruth",
"1 Samuel","2 Samuel","1 Kings","2 Kings",
"1 Chronicles","2 Chronicles",
"Ezra","Nehemiah","Esther",
"Job","Psalms","Proverbs","Ecclesiastes","Song of Solomon",
"Isaiah","Jeremiah","Lamentations","Ezekiel","Daniel",
"Hosea","Joel","Amos","Obadiah","Jonah","Micah","Nahum",
"Habakkuk","Zephaniah","Haggai","Zechariah","Malachi",
"Matthew","Mark","Luke","John","Acts",
"Romans","1 Corinthians","2 Corinthians",
"Galatians","Ephesians","Philippians","Colossians",
"1 Thessalonians","2 Thessalonians",
"1 Timothy","2 Timothy","Titus","Philemon",
"Hebrews","James","1 Peter","2 Peter",
"1 John","2 John","3 John","Jude","Revelation"
];

// ------------------------------------------------------------
// VALID WEBSITE FOLDERS
// ------------------------------------------------------------
const validFolders = [
"Rooted","Rooted/Remedies","Rooted/contentment","Rooted/contentment/Jesus",
"Friday","Friday/Bible","Friday/Father","Friday/Holiness","Friday/Hebrews",
"Unfolding","Questions","Woodworking"
];

// ------------------------------------------------------------
// LOAD JSON
// ------------------------------------------------------------
fetch("https://jonathansworkshop.online/assetts/json/master_scripture_index.json")
    .then(response => response.json())
    .then(data => buildIndex(data))
    .catch(err => {
        document.getElementById("index").innerHTML =
            "<p style='color:red;'>Error loading JSON.</p>";
        console.error(err);
    });

// ------------------------------------------------------------
// BUILD INDEX
// ------------------------------------------------------------
function buildIndex(entries) {

    const index = {};

    entries.forEach(item => {

        // ------------------------------------------------------------
        // CLEAN PATH
        // ------------------------------------------------------------
        let rawPath = item.path.replace(/\\\\/g, "/").replace(/\\/g, "/");

        // Remove backup folder prefix
        rawPath = rawPath.replace(/^.*Backup.*Site\//i, "");

        // Extract filename
        const parts = rawPath.split("/");
        const filename = parts.pop();

        // ------------------------------------------------------------
        // DEEPEST FOLDER DETECTION
        // ------------------------------------------------------------
        let detectedFolder = "";
        let longestMatch = 0;

        for (const folder of validFolders) {
            if (rawPath.includes(folder) && folder.length > longestMatch) {
                longestMatch = folder.length;
                detectedFolder = folder;
            }
        }

        // Build final URL
        const pdfUrl = "https://jonathansworkshop.online/" + detectedFolder + "/" + filename;

        // ------------------------------------------------------------
        // PROCESS REFERENCES
        // ------------------------------------------------------------
        item.references.forEach(ref => {

            const cleaned = ref.replace(/\s+/g, " ").trim();

            // Match book, chapter, verse or verse-range
            const match = cleaned.match(/^([1-3]?\s?[A-Za-z]+)\s+(\d+):(\d+)(?:-(\d+))?/);

            if (!match) return;

            const book = match[1];
            const chapter = match[2];
            const verseStart = match[3];
            const verseEnd = match[4] || null;

            if (!index[book]) index[book] = {};
            if (!index[book][chapter]) index[book][chapter] = [];

            index[book][chapter].push({
                verseStart: verseStart,
                verseEnd: verseEnd,
                url: pdfUrl,
                title: item.title || filename
            });
        });
    });

    renderIndex(index);
}

// ------------------------------------------------------------
// RENDER INDEX
// ------------------------------------------------------------
function renderIndex(index) {
    const container = document.getElementById("index");

    bibleOrder.forEach(book => {
        if (!index[book]) return;

        const bookDiv = document.createElement("div");
        bookDiv.className = "book";
        bookDiv.textContent = book;

        const chapterContainer = document.createElement("div");
        chapterContainer.style.display = "none";

        bookDiv.addEventListener("click", () => {
            chapterContainer.style.display =
                chapterContainer.style.display === "none" ? "block" : "none";
        });

        Object.keys(index[book]).sort((a,b)=>a-b).forEach(chapter => {

            const chapterDiv = document.createElement("div");
            chapterDiv.className = "chapter";
            chapterDiv.textContent = "Chapter " + chapter;

            const verseContainer = document.createElement("div");
            verseContainer.className = "verses";

            chapterDiv.addEventListener("click", () => {
                verseContainer.style.display =
                    verseContainer.style.display === "none" ? "block" : "none";
            });

            index[book][chapter].forEach(entry => {
                const refText = entry.verseEnd
                    ? `${book} ${chapter}:${entry.verseStart}–${entry.verseEnd}`
                    : `${book} ${chapter}:${entry.verseStart}`;

                const p = document.createElement("p");
                p.innerHTML = `
                    <strong>${refText}</strong> — 
                    <a href="${entry.url}" target="_blank">${entry.title}</a>
                    <span style="color:#666; font-size: 14px;"> (Opens PDF — scroll to verse)</span>
                `;
                verseContainer.appendChild(p);
            });

            chapterContainer.appendChild(chapterDiv);
            chapterContainer.appendChild(verseContainer);
        });

        container.appendChild(bookDiv);
        container.appendChild(chapterContainer);
    });
}
</script>

</body>
</html>
