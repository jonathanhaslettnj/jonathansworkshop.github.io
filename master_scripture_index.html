<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scripture Index</title>

<style>
    body {
        font-family: Georgia, serif;
        background: #faf9f7;
        margin: 0;
        padding: 20px;
        color: #333;
    }

    h1 {
        text-align: center;
        font-size: 36px;
        margin-bottom: 10px;
        color: #4a3f2f;
        letter-spacing: 1px;
    }

    h2 {
        text-align: center;
        font-size: 18px;
        font-weight: normal;
        margin-top: 0;
        color: #5a4a3a;
    }

    .book-buttons {
        text-align: center;
        margin: 25px 0;
    }

    .book-buttons a {
        display: inline-block;
        background: #d9e7ff;
        color: #003c7a;
        padding: 8px 14px;
        margin: 6px;
        border-radius: 20px;
        text-decoration: none;
        font-size: 15px;
        border: 1px solid #bcd0f2;
    }

    .book-buttons a:hover {
        background: #c7dbff;
    }

    .book-section {
        margin-top: 40px;
        margin-bottom: 10px;
        text-align: center;
        font-size: 24px;
        color: #2f5e2f;
        font-weight: bold;
    }

    .verse-list {
        width: 80%;
        margin: 0 auto;
        margin-bottom: 30px;
    }

    .verse-list p {
        font-size: 17px;
        margin: 8px 0;
        line-height: 1.5;
    }

    a {
        color: #2a5db0;
        text-decoration: none;
        font-weight: bold;
    }

    a:hover {
        text-decoration: underline;
    }

    .note {
        color: #777;
        font-size: 14px;
        margin-left: 4px;
    }
</style>
</head>

<body>

<h1>Scripture Index</h1>
<h2>Every Scripture reference used across all Bible studies and sermons on Jonathan’s Workshop</h2>

<div id="bookButtons" class="book-buttons"></div>

<div id="index"></div>

<script>
// ------------------------------------------------------------
// CANONICAL BIBLE BOOK ORDER
// ------------------------------------------------------------
const bibleOrder = [
"Genesis","Exodus","Leviticus","Numbers","Deuteronomy",
"Joshua","Judges","Ruth",
"1 Samuel","2 Samuel","1 Kings","2 Kings",
"1 Chronicles","2 Chronicles",
"Ezra","Nehemiah","Esther",
"Job","Psalms","Proverbs","Ecclesiastes","Song of Solomon",
"Isaiah","Jeremiah","Lamentations","Ezekiel","Daniel",
"Hosea","Joel","Amos","Obadiah","Jonah","Micah","Nahum",
"Habakkuk","Zephaniah","Haggai","Zechariah","Malachi",
"Matthew","Mark","Luke","John","Acts",
"Romans","1 Corinthians","2 Corinthians",
"Galatians","Ephesians","Philippians","Colossians",
"1 Thessalonians","2 Thessalonians",
"1 Timothy","2 Timothy","Titus","Philemon",
"Hebrews","James","1 Peter","2 Peter",
"1 John","2 John","3 John","Jude","Revelation"
];

// ------------------------------------------------------------
// VALID WEBSITE FOLDERS (EXACT MATCH ONLY)
// ------------------------------------------------------------
const validFolders = [
"Rooted",
"Rooted/Remedies",
"Rooted/contentment",
"Rooted/contentment/Jesus",
"Friday",
"Friday/Bible",
"Friday/Father",
"Friday/Holiness",
"Friday/Hebrews",
"Unfolding",   // ✔ Only this Unfolding folder is allowed
"Questions",
"Woodworking"
];

// ------------------------------------------------------------
// LOAD JSON
// ------------------------------------------------------------
fetch("https://jonathansworkshop.online/assetts/json/master_scripture_index.json")
    .then(response => response.json())
    .then(data => buildIndex(data))
    .catch(err => {
        document.getElementById("index").innerHTML =
            "<p style='color:red;'>Error loading JSON.</p>";
        console.error(err);
    });

// ------------------------------------------------------------
// BUILD INDEX (FLAT LIST VERSION)
// ------------------------------------------------------------
function buildIndex(entries) {

    const index = {};

    entries.forEach(item => {

        let rawPath = item.path.replace(/\\\\/g, "/").replace(/\\/g, "/");
        rawPath = rawPath.replace(/^.*Backup.*Site\//i, "");

        const parts = rawPath.split("/");
        const filename = parts.pop();

        // ------------------------------------------------------------
        // EXACT FOLDER MATCHING (NO PARTIAL MATCHES)
        // ------------------------------------------------------------
        let detectedFolder = "";
        let longestMatch = 0;

        for (const folder of validFolders) {
            const folderNormalized = folder.replace(/\\/g, "/");

            if (rawPath.includes(folderNormalized + "/") ||
                rawPath.endsWith(folderNormalized)) {

                if (folderNormalized.length > longestMatch) {
                    longestMatch = folderNormalized.length;
                    detectedFolder = folderNormalized;
                }
            }
        }

        // Skip entries from folders not in validFolders
        if (!detectedFolder) return;

        const pdfUrl = "https://jonathansworkshop.online/" + detectedFolder + "/" + filename;

        item.references.forEach(ref => {

            const cleaned = ref.replace(/\s+/g, " ").trim();
            const match = cleaned.match(/^([1-3]?\s?[A-Za-z]+)\s+(\d+):(\d+)(?:-(\d+))?/);

            if (!match) return;

            const book = match[1];
            const chapter = parseInt(match[2]);
            const verseStart = parseInt(match[3]);
            const verseEnd = match[4] ? parseInt(match[4]) : null;

            if (!index[book]) index[book] = [];

            index[book].push({
                book: book,
                chapter: chapter,
                verseStart: verseStart,
                verseEnd: verseEnd,
                url: pdfUrl,
                title: item.title || filename
            });
        });
    });

    renderIndex(index);
}

// ------------------------------------------------------------
// RENDER INDEX (FLAT LIST VERSION)
// ------------------------------------------------------------
function renderIndex(index) {
    const container = document.getElementById("index");
    const buttonContainer = document.getElementById("bookButtons");

    bibleOrder.forEach(book => {
        if (!index[book]) return;

        const count = index[book].length;

        const btn = document.createElement("a");
        btn.href = "#" + book.replace(/\s+/g, "_");
        btn.textContent = `${book} (${count})`;

        buttonContainer.appendChild(btn);
    });

    bibleOrder.forEach(book => {
        if (!index[book]) return;

        const count = index[book].length;

        // ⭐ SORT BY CHAPTER, THEN VERSE START, THEN VERSE END
        index[book].sort((a, b) => {
            if (a.chapter !== b.chapter) return a.chapter - b.chapter;
            if (a.verseStart !== b.verseStart) return a.verseStart - b.verseStart;

            const aEnd = a.verseEnd || a.verseStart;
            const bEnd = b.verseEnd || b.verseStart;
            return aEnd - bEnd;
        });

        const header = document.createElement("div");
        header.className = "book-section";
        header.id = book.replace(/\s+/g, "_");
        header.textContent = `${book} (${count} references)`;

        const verseList = document.createElement("div");
        verseList.className = "verse-list";

        index[book].forEach(entry => {
            const refText = entry.verseEnd
                ? `${entry.book} ${entry.chapter}:${entry.verseStart}–${entry.verseEnd}`
                : `${entry.book} ${entry.chapter}:${entry.verseStart}`;

            const p = document.createElement("p");
            p.innerHTML = `
                <strong>${refText}</strong> — 
                <a href="${entry.url}" target="_blank">${entry.title}</a>
                <span class="note">(Opens PDF — scroll to verse)</span>
            `;
            verseList.appendChild(p);
        });

        container.appendChild(header);
        container.appendChild(verseList);
    });
}
</script>

</body>
</html>
